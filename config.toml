baseURL = 'https://blog.freepackets.net/'
locale = 'en-us'
title = "William's site"
#theme = "ananke"
#theme = "antora-default-ui-hugo-theme"
#theme = "hugo-theme-relearn"
#theme = "cupper-hugo-theme"
theme = "smol"
#theme = "bare"
#theme = "PaperMod"

sectionPagesMenu = "main"

copyright = "william"

[params]
mainSections = ["blog"]
postcss = true
[security.exec]
allow = ["^asciidoctor$", "^npx$"]

[markup]
  [markup.asciidocext]
    [markup.asciidocext.attributes]
      "icons" = "font"
      "source-highlighter" = "highlightjs"
  [markup.highlight]
    # Disable Goldmark Chroma syntax highlighter
    codeFences = false
[security]
  allowContent = [
    '^text/html$',
    '^text/markdown$',
    '^text/org$',
    '^text/asciidoc$',
    '^text/pandoc$',
    '^text/rst$'
  ]

  [markup.goldmark.renderer]
  unsafe = true

[menu]
  [[menu.main]]
        identifier = 'blog'
        name = 'my blog'
        url = '/blog/'
		weight = 10

  [[menu.main]]
        identifier = 'about'
        name = 'about'
        url = '/about/'
		weight = 20

